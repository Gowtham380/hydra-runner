name: Project Hydra Automated Migration Engine

on:
  schedule:
    - cron: '0 * * * *' # Run automatically every 1 hour (24/7 Unlimited)
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  migrate:
    name: Run GDrive to HF Migration
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests python-dotenv cryptography

      - name: Execute Migration Engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python modal_drive_migrator.py
