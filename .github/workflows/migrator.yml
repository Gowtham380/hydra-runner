name: Project Hydra Automated Migration Engine (Matrix Shard Pipeline)

on:
  schedule:
    # Autonomous trigger every 1 hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  migrate:
    name: Shard Runner (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maximum allowed 6-hour runner limit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: 📥 Checkout Runner Repo
        uses: actions/checkout@v4

      - name: 🧹 Free Up 65GB+ NVMe Disk Space (Strip OS Bloatware)
        run: |
          echo "=== DISK BEFORE CLEANUP ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -a --force || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile || true
          echo "=== DISK AFTER CLEANUP (65GB+ FREE NVMe) ==="
          df -h /

      - name: 🔄 Dynamic Engine Sync (Single Source of Truth from SMD-PRIME)
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "🚀 Fetching latest SMD-PRIME master engine via GH_PAT..."
            git clone --depth 1 https://${{ secrets.GH_PAT }}@github.com/Gowtham380/SMD-PRIME.git engine
            echo "ENGINE_DIR=engine" >> $GITHUB_ENV
          else
            echo "ℹ️ GH_PAT not provided. Running local fallback scripts in hydra-runner..."
            echo "ENGINE_DIR=." >> $GITHUB_ENV
          fi

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests python-dotenv cryptography google-auth google-api-python-client

      - name: 🚀 Execute Matrix Shard Migration Engine (${{ matrix.shard }}/4)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
        run: |
          python $ENGINE_DIR/ingester/modal_drive_migrator.py

