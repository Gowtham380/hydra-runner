name: Project Hydra Automated Migration Engine (Matrix Shard Pipeline)

on:
  schedule:
    # Autonomous trigger every 1 hour (24/7)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  migrate:
    name: Shard Runner (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maximum allowed 6-hour runner limit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests python-dotenv cryptography google-auth google-api-python-client

      - name: Execute Matrix Shard Migration Engine
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
        run: |
          python ingester/modal_drive_migrator.py
