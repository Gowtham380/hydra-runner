name: 🔄 2. Full Shard Sync (Shards 1-4)

on:
  schedule:
    # Autonomous trigger every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  migrate:
    name: Shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maximum allowed 6-hour runner limit
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: 📥 Checkout Runner Repo
        uses: actions/checkout@v4

      - name: ⚡ O(1) Smart NVMe Disk Guard
        run: |
          AVAIL_GB=$(df -BG / | awk 'NR==2 {gsub("G",""); print $4}')
          echo "📊 Available NVMe Disk Space: ${AVAIL_GB} GB"
          if [ "$AVAIL_GB" -ge 40 ]; then
            echo "⚡ [O(1) FAST PASS] Sufficient disk space (${AVAIL_GB}GB >= 40GB). Skipping bloatware wipe in 0.001s!"
          else
            echo "⚠️ Low disk space (${AVAIL_GB}GB < 40GB). Purging bloatware in background..."
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" &
          fi
          df -h /

      - name: 🔄 Dynamic Engine Sync (Single Source of Truth from SMD-PRIME)
        run: |
          if [ -n "${{ secrets.GH_PAT }}" ]; then
            echo "🚀 Fetching latest SMD-PRIME master engine via GH_PAT..."
            git clone --depth 1 https://${{ secrets.GH_PAT }}@github.com/Gowtham380/SMD-PRIME.git engine
            echo "ENGINE_DIR=engine" >> $GITHUB_ENV
          else
            echo "ℹ️ GH_PAT not provided. Running local fallback scripts in runner..."
            echo "ENGINE_DIR=." >> $GITHUB_ENV
          fi

      - name: 🐍 Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub requests python-dotenv cryptography google-auth google-api-python-client

      - name: 🚀 Execute Shard Migration Engine (${{ matrix.shard }}/4)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: 4
        run: |
          python $ENGINE_DIR/ingester/modal_drive_migrator.py
