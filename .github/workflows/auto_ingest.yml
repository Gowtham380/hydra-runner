name: SMD Prime / Hydra - Automated Cloud Ingestion Engine

on:
  schedule:
    # Runs automatically every 30 minutes (100% FREE Cloud Worker)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Allows manual one-click trigger from GitHub Actions tab

jobs:
  auto-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Ingestion Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ingester/requirements.txt cryptography

      - name: 🚀 Run High-ROI GDrive to HF & Supabase Ingestion Daemon
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SERVICE_ACCOUNTS_JSON: ${{ secrets.SERVICE_ACCOUNTS_JSON }}
        run: |
          python ingester/auto_drive_watcher.py --once
